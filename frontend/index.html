<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>StudyBuddy AI 🧠</h1>
        <p>Your personal AI study assistant.</p>
    </header>

    <main>
        <section class="card">
            <h2>Ask StudyBuddy</h2>

            <textarea
                id="question"
                placeholder="Ask me anything about your studies..."
            ></textarea>

            <button id="askButton">Ask AI</button>

            <div id="response">
                Your answer will appear here...
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
